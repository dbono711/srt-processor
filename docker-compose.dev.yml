services:
  srt-processor-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
      - "9000-9100:9000-9100/udp"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Preserve Python cache
      - /app/__pycache__
    environment:
      # Optional: Provide OpenAI API key for LLM analysis feature
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command:
      # Auto-apply file changes on save and poll for changes, since native
      # file-change events aren't reliable across the bind mount
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.runOnSave=true
      - --server.fileWatcherType=poll
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
